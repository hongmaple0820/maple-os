name: CI

on:
  push:
    branches:
      - master
      - "codex/**"
    tags:
      - "v*"
  pull_request:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust-check:
    name: Rust Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cargo check
        run: cargo check --all-targets

      - name: Cargo test
        run: cargo test --lib

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -W clippy::all
        continue-on-error: true

  frontend-check:
    name: Frontend Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack & install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared packages first
        run: pnpm --filter=@mapleos/ui --filter=@mapleos/sdk build

      - name: Frontend typecheck
        run: pnpm --filter=mapleos-web typecheck

      - name: Frontend build
        run: pnpm --filter=mapleos-web build

  e2e-product-gate:
    name: E2E Product Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack & install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared packages first
        run: pnpm --filter=@mapleos/ui --filter=@mapleos/sdk build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run real product gate
        run: pnpm exec playwright test tests/e2e/product-gate.spec.ts

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Docker image
        run: docker build -f infra/docker/Dockerfile -t mapleos-server:ci .

      - name: Verify image runs
        run: docker run --rm -e RUST_LOG=info mapleos-server:ci --help || true
