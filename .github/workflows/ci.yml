name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-check:
    name: Rust Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cargo check
        run: cargo check --all-targets

      - name: Cargo test
        run: cargo test --lib

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  frontend-check:
    name: Frontend Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack & install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages first
        run: pnpm --filter=@mapleos/ui --filter=@mapleos/sdk build

      - name: Frontend typecheck
        run: pnpm --filter=mapleos-web typecheck

      - name: Frontend build
        run: pnpm --filter=mapleos-web build

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Docker image
        run: docker build -f infra/docker/Dockerfile -t mapleos-server:ci .

      - name: Verify image runs
        run: docker run --rm -e RUST_LOG=info mapleos-server:ci --help || true