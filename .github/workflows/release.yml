name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. v2.2.0)"
        required: true
        default: "v2.2.0"

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================
  # Job 1: Build Server binary (Linux x86_64)
  # Used by: server .deb, Tauri sidecar, Docker image
  # ============================================================
  build-server-binary:
    name: Server Binary (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.toml') }}
      - run: cargo build --release -p mapleos-server
      - run: strip target/release/mapleos-server
      - uses: actions/upload-artifact@v4
        with:
          name: mapleos-server-binary
          path: target/release/mapleos-server
          retention-days: 7

  # ============================================================
  # Job 2: Build CLI binary (Linux x86_64)
  # ============================================================
  build-cli-binary:
    name: CLI Binary (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cli-${{ hashFiles('**/Cargo.toml') }}
      - run: cargo build --release -p maple-cli
      - run: strip target/release/maple
      - uses: actions/upload-artifact@v4
        with:
          name: maple-cli-binary
          path: target/release/maple
          retention-days: 7

  # ============================================================
  # Job 3: Build Desktop Installers (Tauri)
  # Sidecar: server binary bundled per target
  # ============================================================
  build-desktop:
    name: Desktop (${{ matrix.label }})
    needs: build-server-binary
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, label: linux }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, label: windows }
          - { os: macos-latest, target: aarch64-apple-darwin, label: macos-arm }
          - { os: macos-latest, target: x86_64-apple-darwin, label: macos-intel }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev pkg-config libsqlite3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter=@mapleos/ui --filter=@mapleos/sdk build

      # ── Sidecar binary preparation ──
      - name: Download prebuilt Linux server binary
        uses: actions/download-artifact@v4
        with:
          name: mapleos-server-binary
          path: server-bin-prebuilt
      - name: Place sidecar (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          cp server-bin-prebuilt/mapleos-server apps/desktop/src-tauri/binaries/mapleos-server-x86_64-unknown-linux-gnu
          chmod +x apps/desktop/src-tauri/binaries/mapleos-server-x86_64-unknown-linux-gnu
      - name: Build server for host (non-Linux)
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        run: cargo build --release -p mapleos-server --target ${{ matrix.target }}
      - name: Place sidecar (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/${{ matrix.target }}/release/mapleos-server.exe apps/desktop/src-tauri/binaries/mapleos-server-x86_64-pc-windows-msvc.exe
      - name: Place sidecar (macOS arm)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/${{ matrix.target }}/release/mapleos-server apps/desktop/src-tauri/binaries/mapleos-server-aarch64-apple-darwin
          chmod +x apps/desktop/src-tauri/binaries/mapleos-server-aarch64-apple-darwin
      - name: Place sidecar (macOS intel)
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/${{ matrix.target }}/release/mapleos-server apps/desktop/src-tauri/binaries/mapleos-server-x86_64-apple-darwin
          chmod +x apps/desktop/src-tauri/binaries/mapleos-server-x86_64-apple-darwin

      - name: Build Tauri installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name || inputs.version }}
          releaseName: "MapleOS ${{ github.ref_name || inputs.version }}"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
          updaterJsonPreferNsis: true

  # ============================================================
  # Job 4: Build Server .deb
  # ============================================================
  build-server-deb:
    name: Server .deb
    needs: build-server-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mapleos-server-binary
          path: server-bin
      - run: sudo apt-get install -y dpkg-dev
      - name: Build .deb
        run: |
          VERSION="${{ github.ref_name || inputs.version }}"
          VERSION_NUM="${VERSION#v}"
          mkdir -p pkg/DEBIAN pkg/usr/local/bin pkg/usr/share/mapleos/migrations pkg/usr/share/mapleos/config pkg/etc/systemd/system
          install -m 0755 server-bin/mapleos-server pkg/usr/local/bin/mapleos-server
          cp -r migrations/* pkg/usr/share/mapleos/migrations/ 2>/dev/null || true
          cp -r config/* pkg/usr/share/mapleos/config/ 2>/dev/null || true
          cat > pkg/DEBIAN/control <<CONTROL
          Package: mapleos-server
          Version: ${VERSION_NUM}
          Architecture: amd64
          Maintainer: MapleOS Team <team@mapleos.dev>
          Description: MapleOS Server - AI Native Multi-Agent OS
           MapleOS is an AI Native multi-agent collaborative workstation
           operating system. This package contains the backend server.
          Depends: libsqlite3-0, ca-certificates
          Section: net
          Priority: optional
          CONTROL
          cat > pkg/etc/systemd/system/mapleos.service <<SERVICE
          [Unit]
          Description=MapleOS Server
          After=network.target
          [Service]
          Type=simple
          ExecStart=/usr/local/bin/mapleos-server
          Environment=DATABASE_URL=sqlite:/var/lib/mapleos/mapleos.db
          Environment=RUST_LOG=info
          Environment=MAPLEOS_WEB_DIR=/usr/share/mapleos/web
          WorkingDirectory=/usr/share/mapleos
          Restart=on-failure
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
          SERVICE
          cat > pkg/DEBIAN/postinst <<'POSTINST'
          #!/bin/bash
          set -e
          mkdir -p /var/lib/mapleos
          systemctl daemon-reload
          systemctl enable mapleos
          echo "MapleOS Server installed. Start with: sudo systemctl start mapleos"
          POSTINST
          chmod +x pkg/DEBIAN/postinst
          cat > pkg/DEBIAN/prerm <<'PRERM'
          #!/bin/bash
          systemctl stop mapleos 2>/dev/null || true
          PRERM
          chmod +x pkg/DEBIAN/prerm
          dpkg-deb --build pkg mapleos-server_${VERSION_NUM}_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: mapleos-server-amd64-deb
          path: mapleos-server_*_amd64.deb
          retention-days: 90

  # ============================================================
  # Job 5: Build CLI .deb
  # ============================================================
  build-cli-deb:
    name: CLI .deb
    needs: build-cli-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: maple-cli-binary
          path: cli-bin
      - run: sudo apt-get install -y dpkg-dev
      - name: Build .deb
        run: |
          VERSION="${{ github.ref_name || inputs.version }}"
          VERSION_NUM="${VERSION#v}"
          mkdir -p pkg/DEBIAN pkg/usr/local/bin
          install -m 0755 cli-bin/maple pkg/usr/local/bin/maple
          cat > pkg/DEBIAN/control <<CONTROL
          Package: maple-cli
          Version: ${VERSION_NUM}
          Architecture: amd64
          Maintainer: MapleOS Team <team@mapleos.dev>
          Description: MapleOS CLI Client
           Command-line client for MapleOS.
          Depends: ca-certificates
          Section: utils
          Priority: optional
          CONTROL
          dpkg-deb --build pkg maple-cli_${VERSION_NUM}_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: maple-cli-amd64-deb
          path: maple-cli_*_amd64.deb
          retention-days: 90

  # ============================================================
  # Job 6: Docker All-in-One (GHCR)
  # ============================================================
  build-docker-allinone:
    name: Docker All-in-One
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern=latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.allinone
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Job 7: Create GitHub Release (waits for ALL builds)
  # ============================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-server-deb, build-cli-deb, build-docker-allinone, build-desktop]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mapleos-server-amd64-deb
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: maple-cli-amd64-deb
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.version }}
          name: "MapleOS ${{ github.ref_name || inputs.version }}"
          body: |
            ## MapleOS ${{ github.ref_name || inputs.version }}

            ### Install

            #### Desktop (Windows / macOS / Linux)
            Download the installer for your platform from the Assets section.

            #### Server (Linux x86_64)
            ```bash
            sudo dpkg -i mapleos-server_*_amd64.deb
            sudo systemctl start mapleos
            ```

            #### CLI (Linux x86_64)
            ```bash
            sudo dpkg -i maple-cli_*_amd64.deb
            maple status
            ```

            #### Docker
            ```bash
            docker run -d -p 7788:7788 -v mapleos-data:/data ghcr.io/hongmaple0820/maple-os:latest
            ```
          files: |
            artifacts/mapleos-server_*_amd64.deb
            artifacts/maple-cli_*_amd64.deb
          draft: false
          prerelease: false
