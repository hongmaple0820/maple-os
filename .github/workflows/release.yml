name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-server-binaries:
    name: Build Server ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: mapleos-server-x86_64-linux
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: mapleos-server-aarch64-macos
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: mapleos-server-x86_64-macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: mapleos-server-x86_64-windows.exe
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev

      - name: Install system dependencies (MacOS)
        if: runner.os == 'macOS'
        run: brew install sqlite3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p mapleos-server

      - name: Strip binary (Linux/Mac)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/mapleos-server

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ${{ matrix.artifact }}.tar.gz mapleos-server

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          compress-archive -Path mapleos-server.exe -DestinationPath ${{ matrix.artifact }}.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}.*

  build-desktop-linux:
    name: Build Desktop Linux
    runs-on: ubuntu-latest
    needs: [build-server-binaries]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libsqlite3-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack & install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build shared packages
        run: pnpm --filter=@mapleos/ui --filter=@mapleos/sdk build

      - name: Download server binary for sidecar
        uses: actions/download-artifact@v4
        with:
          name: mapleos-server-x86_64-linux
          path: server-binary

      - name: Prepare sidecar binary
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          cp server-binary/mapleos-server-x86_64-linux.tar.gz server-binary/mapleos-server.tar.gz
          tar xzf server-binary/mapleos-server.tar.gz -C server-binary
          mv server-binary/mapleos-server apps/desktop/src-tauri/binaries/mapleos-server-x86_64-unknown-linux-gnu

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2"

      - name: Build desktop app
        run: cd apps/desktop && pnpm tauri build

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapleos-desktop-linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm

  build-desktop-macos:
    name: Build Desktop macOS
    runs-on: macos-latest
    needs: [build-server-binaries]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: brew install sqlite3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack & install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build shared packages
        run: pnpm --filter=@mapleos/ui --filter=@mapleos/sdk build

      - name: Download server binary for sidecar
        uses: actions/download-artifact@v4
        with:
          name: mapleos-server-aarch64-macos
          path: server-binary

      - name: Prepare sidecar binary
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          tar xzf server-binary/mapleos-server-aarch64-macos.tar.gz -C server-binary
          mv server-binary/mapleos-server apps/desktop/src-tauri/binaries/mapleos-server-aarch64-apple-darwin

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2"

      - name: Build desktop app
        run: cd apps/desktop && pnpm tauri build --target aarch64-apple-darwin

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapleos-desktop-macos-arm
          path: apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  build-desktop-windows:
    name: Build Desktop Windows
    runs-on: windows-latest
    needs: [build-server-binaries]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack & install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build shared packages
        run: pnpm --filter=@mapleos/ui --filter=@mapleos/sdk build

      - name: Download server binary for sidecar
        uses: actions/download-artifact@v4
        with:
          name: mapleos-server-x86_64-windows.exe
          path: server-binary

      - name: Prepare sidecar binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path apps/desktop/src-tauri/binaries
          Expand-Archive -Path server-binary/mapleos-server-x86_64-windows.exe.zip -DestinationPath server-binary
          Move-Item -Path server-binary/mapleos-server.exe -Destination apps/desktop/src-tauri/binaries/mapleos-server-x86_64-pc-windows-msvc.exe

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2"

      - name: Build desktop app
        run: cd apps/desktop && pnpm tauri build --target x86_64-pc-windows-msvc

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapleos-desktop-windows
          path: |
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

  build-mobile-android:
    name: Build Mobile Android APK
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack & install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build shared packages
        run: pnpm --filter=@mapleos/ui --filter=@mapleos/sdk build

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Build Android APK (preview)
        if: ${{ secrets.EXPO_TOKEN }}
        working-directory: apps/mobile
        run: eas build --platform android --profile preview --local --output build/
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload mobile artifact
        if: ${{ secrets.EXPO_TOKEN }}
        uses: actions/upload-artifact@v4
        with:
          name: mapleos-mobile-android
          path: apps/mobile/build/*.apk

  build-web-static:
    name: Build Web Static Export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack & install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build shared packages
        run: pnpm --filter=@mapleos/ui --filter=@mapleos/sdk build

      - name: Build web frontend
        run: pnpm --filter=mapleos-web build

      - name: Package web static files
        run: |
          cd apps/web
          tar czf mapleos-web-static.tar.gz .next/

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapleos-web-static
          path: apps/web/mapleos-web-static.tar.gz

  build-docker:
    name: Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/mapleos-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  create-release:
    name: Create GitHub Release
    needs: [build-server-binaries, build-desktop-linux, build-desktop-macos, build-desktop-windows, build-mobile-android, build-web-static, build-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/mapleos-server-x86_64-linux/mapleos-server-x86_64-linux.tar.gz
            artifacts/mapleos-server-aarch64-macos/mapleos-server-aarch64-macos.tar.gz
            artifacts/mapleos-server-x86_64-macos/mapleos-server-x86_64-macos.tar.gz
            artifacts/mapleos-server-x86_64-windows/mapleos-server-x86_64-windows.exe.zip
            artifacts/mapleos-desktop-linux/*.deb
            artifacts/mapleos-desktop-linux/*.rpm
            artifacts/mapleos-desktop-macos-arm/*.dmg
            artifacts/mapleos-desktop-windows/*.msi
            artifacts/mapleos-mobile-android/*.apk
            artifacts/mapleos-web-static/mapleos-web-static.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}