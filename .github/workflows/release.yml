name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. v2.1.0)"
        required: true
        default: "v2.1.0"

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================
  # Job 1: Build Web Static Export
  # ============================================================
  build-web:
    name: Build Web Static Export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - run: pnpm install --no-frozen-lockfile

      - run: pnpm --filter=@mapleos/ui --filter=@mapleos/sdk build

      - run: NEXT_STATIC_EXPORT=1 pnpm --filter=mapleos-web build

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapleos-web-${{ github.ref_name || inputs.version }}
          path: apps/web/out/
          retention-days: 90

  # ============================================================
  # Job 2: Build Server Binaries (Linux x86_64)
  # ============================================================
  build-server-linux:
    name: Build Server (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - run: sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.toml') }}

      - run: cargo build --release -p mapleos-server

      - name: Package server + migrations
        run: |
          mkdir -p mapleos-server-linux
          cp target/release/mapleos-server mapleos-server-linux/
          cp -r migrations mapleos-server-linux/
          cp -r config mapleos-server-linux/
          tar czf mapleos-server-linux-x86_64.tar.gz mapleos-server-linux/

      - uses: actions/upload-artifact@v4
        with:
          name: mapleos-server-linux-x86_64
          path: mapleos-server-linux-x86_64.tar.gz
          retention-days: 90

  # ============================================================
  # Job 3: Build CLI Binary (Linux x86_64)
  # ============================================================
  build-cli-linux:
    name: Build CLI (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - run: sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cli-${{ hashFiles('**/Cargo.toml') }}

      - run: cargo build --release -p maple-cli

      - uses: actions/upload-artifact@v4
        with:
          name: maple-cli-linux-x86_64
          path: target/release/maple
          retention-days: 90

  # ============================================================
  # Job 4: Build Desktop (Tauri) — Windows + macOS + Linux
  # ============================================================
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev pkg-config libsqlite3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - run: pnpm install --no-frozen-lockfile

      - run: pnpm --filter=@mapleos/ui --filter=@mapleos/sdk build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name || inputs.version }}
          releaseName: "MapleOS ${{ github.ref_name || inputs.version }}"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  # ============================================================
  # Job 5: Docker All-in-One Image (GHCR)
  # ============================================================
  build-docker-allinone:
    name: Docker All-in-One
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern=allinone-latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.allinone
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Job 6: Create GitHub Release with all artifacts
  # ============================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-web, build-server-linux, build-cli-linux]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mapleos-web-${{ github.ref_name || inputs.version }}
          path: artifacts/web

      - uses: actions/download-artifact@v4
        with:
          name: mapleos-server-linux-x86_64
          path: artifacts/server

      - uses: actions/download-artifact@v4
        with:
          name: maple-cli-linux-x86_64
          path: artifacts/cli

      - name: Create release archive
        run: |
          cd artifacts
          tar czf mapleos-web-static.tar.gz -C web .
          mv server/mapleos-server-linux-x86_64.tar.gz .
          mv cli/maple .
          chmod +x maple

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.version }}
          name: "MapleOS ${{ github.ref_name || inputs.version }}"
          body: |
            ## MapleOS ${{ github.ref_name || inputs.version }}

            ### Downloads
            - **Web Static**: mapleos-web-static.tar.gz (deploy to any web server)
            - **Server (Linux x86_64)**: mapleos-server-linux-x86_64.tar.gz (includes migrations + config)
            - **CLI (Linux x86_64)**: maple (standalone binary)
            - **Desktop**: Download from the Assets section below (Tauri builds for Windows/macOS/Linux)
            - **Docker All-in-One**: `docker pull ghcr.io/hongmaple0820/maple-os:allinone-latest`

            ### Quick Start (Docker)
            ```bash
            docker run -d -p 7788:7788 ghcr.io/hongmaple0820/maple-os:allinone-latest
            ```
            Open http://localhost:7788 in your browser.

            ### Quick Start (Binary)
            ```bash
            tar xzf mapleos-server-linux-x86_64.tar.gz
            cd mapleos-server-linux
            ./mapleos-server
            ```
            Open http://localhost:7788 in your browser.
          files: |
            artifacts/mapleos-web-static.tar.gz
            artifacts/mapleos-server-linux-x86_64.tar.gz
            artifacts/maple
          draft: false
          prerelease: false
