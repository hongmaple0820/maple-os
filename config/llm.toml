# LLM服务商配置文件
# 优先级：环境变量 > 配置文件 > 默认值

[default]
# 默认模型（当未指定模型时使用）
model = "ollama/qwen2.5:7b"
# 每日预算限制（美元）
daily_budget = 50.0
# 启用路由规则
enable_routing = true

# Ollama本地模型配置
[ollama]
enabled = true
base_url = "http://127.0.0.1:11434"
models = ["qwen2.5:7b", "qwen2.5:14b", "llama3.1:8b", "deepseek-coder:6.7b"]
default_model = "qwen2.5:7b"

# DeepSeek配置
[deepseek]
enabled = false
api_key = ""  # 或使用环境变量 DEEPSEEK_API_KEY
base_url = "https://api.deepseek.com"
models = ["deepseek-chat", "deepseek-coder"]
default_model = "deepseek-chat"
pricing = { input = 0.0014, output = 0.0028 }
context_length = 128000

# Anthropic配置
[anthropic]
enabled = false
api_key = ""  # 或使用环境变量 ANTHROPIC_API_KEY
base_url = "https://api.anthropic.com"
models = ["claude-3-5-sonnet-20241022", "claude-3-opus-20240229"]
default_model = "claude-3-5-sonnet-20241022"
pricing = { input = 0.003, output = 0.015 }
context_length = 200000

# 通义千问配置
[qwen]
enabled = false
api_key = ""  # 或使用环境变量 QWEN_API_KEY
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
models = ["qwen-plus", "qwen-turbo", "qwen-max"]
default_model = "qwen-plus"
pricing = { input = 0.0008, output = 0.002 }
context_length = 128000

# 智谱GLM配置
[glm]
enabled = false
api_key = ""  # 或使用环境变量 GLM_API_KEY
base_url = "https://open.bigmodel.cn/api/paas/v4"
models = ["glm-4", "glm-4-flash", "glm-3-turbo"]
default_model = "glm-4"
pricing = { input = 0.001, output = 0.001 }
context_length = 128000

# OpenAI配置
[openai]
enabled = false
api_key = ""  # 或使用环境变量 OPENAI_API_KEY
base_url = "https://api.openai.com"
models = ["gpt-4o", "gpt-4o-mini", "gpt-4-turbo", "gpt-3.5-turbo"]
default_model = "gpt-4o-mini"
pricing = { input = 0.005, output = 0.015 }
context_length = 128000

# Google Gemini配置
[google]
enabled = false
api_key = ""  # 或使用环境变量 GOOGLE_API_KEY
base_url = "https://generativelanguage.googleapis.com/v1beta"
models = ["gemini-1.5-pro", "gemini-1.5-flash"]
default_model = "gemini-1.5-flash"
pricing = { input = 0.00125, output = 0.005 }
context_length = 1000000

# 路由规则配置
[[routing_rules]]
name = "privacy-sensitive"
condition = "task.privacy_level == 'sensitive'"
preferred = ["ollama/qwen2.5:7b"]
fallback_to_cloud = false

[[routing_rules]]
name = "vision-tasks"
condition = "task.has_image == true"
preferred = ["claude-3-5-sonnet-20241022", "gpt-4o"]
fallback_to_cloud = true

[[routing_rules]]
name = "code-tasks"
condition = "task.type == 'code_generation'"
preferred = ["deepseek-coder", "codestral"]
fallback_to_cloud = true

# 回退链配置
fallback_chain = ["ollama/qwen2.5:7b", "deepseek-chat", "claude-3-5-sonnet-20241022"]