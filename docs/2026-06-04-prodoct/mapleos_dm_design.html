
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D1117;--surf:#161B22;--surf2:#1C2128;--surf3:#252C36;
  --bdr:#30363D;--bdr2:#484F58;
  --tx:#E6EDF3;--muted:#8B949E;--hint:#6E7681;
  --blue:#2F81F7;--green:#3FB950;--yellow:#D29922;--red:#F85149;--purple:#BC8CFF;--teal:#2DD4BF;
  font-family:'Anthropic Sans',system-ui,sans-serif;font-size:13px;color:var(--tx);
}
.app{background:var(--bg);border-radius:14px;overflow:hidden;border:1px solid var(--bdr);display:flex;flex-direction:column}
.topbar{height:44px;background:var(--surf);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0}
.logo{display:flex;align-items:center;gap:6px;font-weight:500;font-size:13px}
.logo-leaf{width:20px;height:20px;background:var(--blue);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
.body{display:flex;height:520px}
.left{width:240px;background:var(--surf);border-right:1px solid var(--bdr);display:flex;flex-direction:column;flex-shrink:0}
.left-search{padding:10px 10px 6px}
.search-box{width:100%;background:var(--surf3);border:1px solid var(--bdr);border-radius:7px;padding:6px 10px;color:var(--tx);font-size:12px;outline:none;font-family:inherit}
.search-box::placeholder{color:var(--hint)}
.left-section{padding:8px 10px 4px}
.sec-label{font-size:11px;font-weight:500;color:var(--hint);text-transform:uppercase;letter-spacing:.05em;padding:0 4px 4px}
.dm-item{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:7px;cursor:pointer;transition:background .12s}
.dm-item:hover{background:var(--surf3)}
.dm-item.active{background:var(--surf3)}
.dm-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0;position:relative}
.dm-status{position:absolute;bottom:-1px;right:-1px;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--surf)}
.dm-info{flex:1;min-width:0}
.dm-name{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dm-preview{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.dm-meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.dm-time{font-size:11px;color:var(--hint)}
.unread-badge{background:var(--blue);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;font-weight:600;min-width:18px;text-align:center}
.dm-type-badge{font-size:10px;padding:1px 5px;border-radius:8px}
.badge-agent{background:rgba(188,140,255,.15);color:var(--purple)}
.badge-a2a{background:rgba(45,212,191,.15);color:var(--teal)}
.badge-human{background:rgba(47,129,247,.12);color:var(--blue)}

.right{flex:1;display:flex;flex-direction:column;overflow:hidden}
.dm-header{height:52px;background:var(--surf2);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0}
.dm-header-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;flex-shrink:0;position:relative}
.dm-header-info{flex:1}
.dm-header-name{font-size:14px;font-weight:500}
.dm-header-sub{font-size:11px;color:var(--muted);margin-top:1px}
.hdr-action{padding:4px 11px;border-radius:6px;border:1px solid var(--bdr);color:var(--muted);cursor:pointer;font-size:12px;background:transparent;transition:all .15s;font-family:inherit}
.hdr-action:hover{border-color:var(--bdr2);color:var(--tx)}
.hdr-action.primary{border-color:var(--blue);color:var(--blue)}
.hdr-action.primary:hover{background:rgba(47,129,247,.1)}
.hdr-icon{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);transition:all .12s;background:transparent;border:none}
.hdr-icon:hover{background:var(--surf3);color:var(--tx)}

.messages{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:3px}
.bubble-row{display:flex;gap:8px;max-width:100%;align-items:flex-end}
.bubble-row.mine{flex-direction:row-reverse}
.bubble-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0}
.bubble{padding:8px 12px;border-radius:14px;max-width:72%;font-size:13px;line-height:1.5;word-break:break-word}
.bubble.other{background:var(--surf3);border-bottom-left-radius:4px;color:var(--tx)}
.bubble.mine{background:var(--blue);border-bottom-right-radius:4px;color:#fff}
.bubble.agent{background:var(--surf2);border:1px solid var(--bdr);border-bottom-left-radius:4px;color:var(--tx)}
.bubble.a2a{background:var(--surf2);border:1px solid rgba(45,212,191,.25);border-bottom-left-radius:4px;color:var(--tx)}
.bubble.system{background:transparent;border:1px solid var(--bdr);color:var(--muted);font-size:12px;text-align:center;border-radius:10px;padding:5px 12px;max-width:80%;margin:4px auto}
.bubble-meta{font-size:10px;margin-top:3px;padding:0 2px}
.meta-mine{color:rgba(255,255,255,.55);text-align:right}
.meta-other{color:var(--hint)}

.tool-inline{background:var(--surf);border:1px solid var(--bdr);border-radius:8px;padding:7px 10px;margin-top:5px;cursor:pointer}
.tool-inline-hdr{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500}
.tool-inline-hdr .ico{color:var(--purple)}
.tool-stat{margin-left:auto;font-size:11px;padding:2px 7px;border-radius:10px}
.stat-ok{background:rgba(63,185,80,.15);color:var(--green)}
.stat-run{background:rgba(47,129,247,.15);color:var(--blue)}
.tool-args{font-size:11px;color:var(--muted);margin-top:3px;font-family:monospace}

.grant-card{background:var(--surf);border:1px solid rgba(47,129,247,.3);border-radius:10px;padding:10px 12px;margin-top:5px}
.grant-title{font-size:12px;font-weight:500;color:var(--blue);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.grant-list{display:flex;flex-wrap:wrap;gap:5px}
.grant-tag{font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid var(--bdr);color:var(--muted);display:flex;align-items:center;gap:4px;cursor:pointer;transition:all .12s}
.grant-tag:hover{border-color:var(--bdr2);color:var(--tx)}
.grant-tag.active{border-color:var(--blue);color:var(--blue);background:rgba(47,129,247,.08)}
.grant-tag .chk{font-size:11px}

.a2a-notice{background:rgba(45,212,191,.07);border:1px solid rgba(45,212,191,.2);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--teal);display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-shrink:0;margin:0 16px 8px}

.input-area{border-top:1px solid var(--bdr);padding:10px 14px;background:var(--surf);flex-shrink:0}
.input-row{display:flex;gap:8px;align-items:flex-end}
.textarea{flex:1;background:var(--surf3);border:1px solid var(--bdr);border-radius:8px;padding:8px 12px;color:var(--tx);font-size:13px;font-family:inherit;resize:none;outline:none;line-height:1.45;min-height:36px;transition:border-color .15s}
.textarea:focus{border-color:var(--blue)}
.send{padding:7px 16px;border-radius:7px;background:var(--blue);color:#fff;border:none;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:opacity .15s}
.send:hover{opacity:.88}
.send:disabled{opacity:.4;cursor:default}
.input-hint{font-size:11px;color:var(--hint);margin-bottom:5px;display:flex;align-items:center;gap:8px}

@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.dots span{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite;margin-right:3px}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}

.readonly-bar{background:rgba(45,212,191,.07);border-bottom:1px solid rgba(45,212,191,.2);padding:6px 14px;font-size:12px;color:var(--teal);display:flex;align-items:center;gap:8px;flex-shrink:0}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}

.persona-bar{background:rgba(188,140,255,.07);border-bottom:1px solid rgba(188,140,255,.2);padding:5px 14px;font-size:11px;color:var(--purple);display:flex;align-items:center;gap:8px;flex-shrink:0}
.persona-select{background:var(--surf3);border:1px solid rgba(188,140,255,.3);border-radius:5px;color:var(--purple);font-size:11px;padding:2px 6px;font-family:inherit;cursor:pointer;outline:none}
</style>

<h2 class="sr-only">MapleOS v3 私聊设计预览，包含人与人、人与 Agent、Agent 与 Agent 三种模式的交互界面</h2>

<script>
var currentDm = 'human-agent';
var grantState = {bash:false, file_edit:true, web_search:true, think:true};
var personaState = 'default';
var msgInputs = {};

function now(){
  var d=new Date();
  return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
}

function bubble(content,type,time,extra){
  var extraHtml=extra||'';
  return '<div class="bubble-row'+(type==='mine'?' mine':'')+'">'+
    (type!=='mine'?'<div class="bubble-avatar" style="'+avatarStyle(type)+'">'+avatarContent(type)+'</div>':'')+
    '<div><div class="bubble '+type+'">'+content+extraHtml+'</div>'+
    '<div class="bubble-meta '+(type==='mine'?'meta-mine':'meta-other')+'">'+time+'</div></div>'+
    (type==='mine'?'<div class="bubble-avatar" style="background:linear-gradient(135deg,#0969DA,#2563EB);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:#fff">ZH</div>':'')+
  '</div>';
}

function avatarStyle(type){
  if(type==='agent'||type==='a2a') return 'background:linear-gradient(135deg,#7C3AED,#A855F7);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center';
  if(type==='other') return 'background:linear-gradient(135deg,#0969DA,#2563EB);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:#fff';
  return '';
}
function avatarContent(type){
  if(type==='agent') return '<i class="ti ti-robot" style="font-size:12px;color:#fff"></i>';
  if(type==='a2a') return '<i class="ti ti-robot" style="font-size:12px;color:#fff"></i>';
  if(type==='other') return 'LS';
  return '';
}

function toolCard(name,args,status){
  var stClass=status==='ok'?'stat-ok':'stat-run';
  var stTxt=status==='ok'?'✓ 完成':'▶ 运行中';
  return '<div class="tool-inline"><div class="tool-inline-hdr"><i class="ti ti-terminal ico" aria-hidden="true"></i>'+name+'<span class="tool-stat '+stClass+'">'+stTxt+'</span></div><div class="tool-args">'+args+'</div></div>';
}

function grantCardHtml(){
  var tags=Object.keys(grantState).map(function(k){
    return '<div class="grant-tag'+(grantState[k]?' active':'')+'" onclick="toggleGrant(\''+k+'\')"><span class="chk">'+(grantState[k]?'✓':'○')+'</span>'+k+'</div>';
  }).join('');
  return '<div class="grant-card"><div class="grant-title"><i class="ti ti-key" aria-hidden="true"></i>已授权工具</div><div class="grant-list">'+tags+'</div></div>';
}

function toggleGrant(tool){
  grantState[tool]=!grantState[tool];
  document.querySelectorAll('.grant-card').forEach(function(el){el.outerHTML=grantCardHtml();});
}

var dmConfigs = {
  'human-agent': {
    headerAvatar: '<div style="background:linear-gradient(135deg,#7C3AED,#A855F7);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center"><i class="ti ti-robot" style="font-size:15px;color:#fff"></i></div>',

      {type:'agent', text:'读完了。L23 和 L47 的 <code style="background:var(--surf3);padding:1px 4px;border-radius:4px;font-size:11px">unwrap()</code> 确实有问题——如果 JWT 格式不合法会直接 panic。建议改成用 <code style="background:var(--surf3);padding:1px 4px;border-radius:4px;font-size:11px">?</code> 传播错误或显式 match。\n\n要我直接修复吗？', time:'09:19'},

  'a2a': {

    headerName: 'security-bot → coder',

var personaOpen = false;
var grantsOpen = false;

function togglePersona(){
  personaOpen=!personaOpen;
  renderDm(currentDm);
}
function toggleGrants(){
  grantsOpen=!grantsOpen;
  renderDm(currentDm);
}

function switchDm(id,el){
  currentDm=id;
  personaOpen=false;
  grantsOpen=false;
  document.querySelectorAll('.dm-item').forEach(function(i){i.classList.remove('active')});
  el.classList.add('active');
  renderDm(id);
}

function handleIntervene(){
  var msgs=document.getElementById('dm-messages');
  if(!msgs)return;
  var div=document.createElement('div');
  div.innerHTML='<div class="bubble-row"><div class="bubble system">🛑 你介入了此 A2A 对话 · A2A 对话已暂停，等待你的指令</div></div>';
  msgs.appendChild(div.firstElementChild);
  msgs.scrollTop=msgs.scrollHeight;
  document.getElementById('dm-input').disabled=false;
  document.getElementById('dm-send').disabled=false;
  document.getElementById('dm-placeholder').textContent='输入你的指令，Agent 将等待你的决定...';
}

function renderDm(id){
  var cfg=dmConfigs[id];
  if(!cfg)return;
  var panel=document.getElementById('right-panel');

  var personaBar='';
  if(cfg.showPersona&&personaOpen){
    personaBar='<div class="persona-bar"><i class="ti ti-user" aria-hidden="true"></i> 当前 Persona: <select class="persona-select" onchange="personaState=this.value"><option value="default">默认 (coder.soul)</option><option value="mentor">导师模式 (mentor.soul)</option><option value="minimal">极简模式</option></select><span style="margin-left:auto;cursor:pointer;font-size:11px;opacity:.7" onclick="personaOpen=false;renderDm(currentDm)">✕</span></div>';
  }

  var a2aNotice='';
  if(cfg.showA2A){
    a2aNotice='<div class="readonly-bar"><i class="ti ti-eye" aria-hidden="true"></i>你正在监听 Agent 间的委托对话 · 只读视图 · 点击"介入"可暂停并介入</div>';
  }

  var grantSection='';
  if(id==='human-agent'&&grantsOpen){
    grantSection='<div style="padding:0 14px 8px">'+grantCardHtml()+'</div>';
  }

  var msgsHtml=cfg.msgs.map(function(m){
    if(m.type==='system') return '<div style="text-align:center;margin:6px 0"><span style="font-size:11px;color:var(--hint);background:var(--surf2);padding:3px 10px;border-radius:8px">'+m.text+'</span></div>';
    var toolHtml=m.tool?toolCard(m.tool.name,m.tool.args,m.tool.status):'';
    var txt=m.text.replace(/\n/g,'<br>');
    if(m.type==='a2a-left'||m.type==='a2a-right'){
      var isRight=m.type==='a2a-right';
      return '<div class="bubble-row'+(isRight?' mine':'')+'" style="gap:8px">'+
        (!isRight?m.avatar:'')+
        '<div><div style="font-size:10px;color:var(--hint);margin-bottom:2px;'+(isRight?'text-align:right':'')+'">'+(isRight?'':m.name+' · ')+m.time+(isRight?' · '+m.name:'')+'</div>'+
        '<div class="bubble a2a">'+txt+(toolHtml?'<div style="margin-top:5px">'+toolHtml+'</div>':'')+'</div></div>'+
        (isRight?m.avatar:'')+
      '</div>';
    }
    return bubble(txt+toolHtml,m.type,m.time);
  }).join('');

  var inputDisabled=cfg.readonly?'disabled':'';
  var sendDisabled=cfg.readonly?'disabled':'';

  panel.innerHTML=
    '<div class="dm-header">'+
      cfg.headerAvatar+
      '<div class="dm-header-info">'+
        '<div class="dm-header-name">'+cfg.headerStatus+cfg.headerName+'</div>'+
        '<div class="dm-header-sub">'+cfg.headerSub+'</div>'+
      '</div>'+
      cfg.extraActions+
      '<button class="hdr-icon" aria-label="搜索"><i class="ti ti-search" aria-hidden="true" style="font-size:15px"></i></button>'+
      '<button class="hdr-icon" aria-label="更多"><i class="ti ti-dots" aria-hidden="true" style="font-size:15px"></i></button>'+
    '</div>'+
    personaBar+
    a2aNotice+
    grantSection+
    '<div class="messages" id="dm-messages">'+msgsHtml+'</div>'+
    '<div class="input-area">'+
      (cfg.readonly?'<div class="input-hint"><i class="ti ti-eye" aria-hidden="true"></i> 只读模式 · 点击右上角"介入"按钮参与对话</div>':'')+
      '<div class="input-row">'+
        '<textarea class="textarea" id="dm-input" '+(cfg.readonly?'disabled':'')+' placeholder="'+cfg.placeholder+'" id2="dm-placeholder" rows="1" onkeydown="handleKey(event,\''+id+'\')"></textarea>'+
        '<button class="send" id="dm-send" '+(cfg.readonly?'disabled':'')+' onclick="sendDmMsg(\''+id+'\')">发送</button>'+
      '</div>'+
    '</div>';

  var msgs=document.getElementById('dm-messages');
  if(msgs)msgs.scrollTop=msgs.scrollHeight;
}

function handleKey(e,id){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendDmMsg(id);}
}

var replyCounters={};
var agentRepliesMap={
  'human-agent':['好的，继续看...','这个问题我来分析一下。','已完成，请查看结果。','没问题，我来处理。'],
  'human-agent2':['明白，已记录。','扫描完成，无异常。','报告已更新。'],
  'human-human':['好的，明白了。','我去确认一下。','这个逻辑没问题。'],
};

function sendDmMsg(id){
  var inp=document.getElementById('dm-input');
  if(!inp||inp.disabled)return;
  var txt=inp.value.trim();
  if(!txt)return;
  inp.value='';
  var msgs=document.getElementById('dm-messages');
  if(!msgs)return;
  var div=document.createElement('div');
  div.innerHTML=bubble(txt,'mine',now());
  msgs.appendChild(div.firstElementChild);
  msgs.scrollTop=msgs.scrollHeight;

  var cfg=dmConfigs[id];
  if(id==='human-human')return;

  setTimeout(function(){
    var typingDiv=document.createElement('div');
    var agName=id==='human-agent'?'coder':'security-bot';
    var agColor=id==='human-agent'?'background:linear-gradient(135deg,#7C3AED,#A855F7)':'background:linear-gradient(135deg,#D05538,#F87060)';
    typingDiv.setAttribute('id','typing-indicator');
    typingDiv.innerHTML='<div class="bubble-row" style="gap:8px"><div style="'+agColor+';width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center"><i class="ti ti-robot" style="font-size:12px;color:#fff"></i></div><div><div class="bubble agent" style="padding:10px 14px"><div class="dots"><span></span><span></span><span></span></div></div></div></div>';
    msgs.appendChild(typingDiv);
    msgs.scrollTop=msgs.scrollHeight;

    setTimeout(function(){
      var t=document.getElementById('typing-indicator');
      if(t)t.remove();
      var replies=agentRepliesMap[id]||['好的。'];
      var r=replies[(replyCounters[id]||0)%replies.length];
      replyCounters[id]=(replyCounters[id]||0)+1;
      var d2=document.createElement('div');
      d2.innerHTML=bubble(r,'agent',now());
      msgs.appendChild(d2.firstElementChild);
      msgs.scrollTop=msgs.scrollHeight;
    },1000+Math.random()*600);
  },400+Math.random()*300);
}

renderDm('human-agent');
</script>
