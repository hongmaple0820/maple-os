<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mapleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a56DB"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect width="256" height="256" rx="56" fill="#0F172A"/>
  
  <!-- Stylized maple leaf with circuit patterns -->
  <g transform="translate(128, 128)">
    <!-- Maple leaf shape (simplified geometric) -->
    <path d="
      M 0,-70
      L 12,-45 L 35,-52 L 25,-28
      L 50,-18 L 30,-5 L 55,8
      L 28,12 L 38,38 L 15,25
      L 0,55 L -15,25 L -38,38
      L -28,12 L -55,8 L -30,-5
      L -50,-18 L -25,-28 L -35,-52
      L -12,-45 Z
    " fill="url(#mapleGrad)" stroke="url(#circuitGrad)" stroke-width="1.5"/>
    
    <!-- Circuit lines pattern -->
    <g stroke="#22D3EE" stroke-width="1.2" opacity="0.5" fill="none">
      <line x1="-20" y1="-30" x2="20" y2="-30"/>
      <line x1="20" y1="-30" x2="20" y2="-10"/>
      <line x1="20" y1="-10" x2="35" y2="-10"/>
      <line x1="-20" y1="-30" x2="-20" y2="0"/>
      <line x1="-20" y1="0" x2="-35" y2="0"/>
      <line x1="0" y1="20" x2="0" y2="40"/>
      <line x1="0" y1="20" x2="20" y2="20"/>
      <line x1="-15" y1="35" x2="15" y2="35"/>
    </g>
    
    <!-- Circuit nodes -->
    <g fill="#22D3EE" opacity="0.8">
      <circle cx="20" cy="-30" r="2"/>
      <circle cx="-20" cy="0" r="2"/>
      <circle cx="0" cy="20" r="2"/>
      <circle cx="35" cy="-10" r="1.5"/>
      <circle cx="-35" cy="0" r="1.5"/>
      <circle cx="20" cy="20" r="1.5"/>
      <circle cx="0" cy="40" r="1.5"/>
    </g>
    
    <!-- Center node -->
    <circle cx="0" cy="-5" r="5" fill="#F0F9FF" opacity="0.9"/>
    <circle cx="0" cy="-5" r="2.5" fill="#06B6D4"/>
  </g>
</svg>
