services:
  # ============================================================
  # Option 1: All-in-One (recommended for quick start)
  # Single container with web + server, no separate web server needed.
  # Usage: docker compose up allinone
  # ============================================================
  allinone:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.allinone
    ports:
      - "7788:7788"
    volumes:
      - mapleos-data:/data
    environment:
      - RUST_LOG=info
      - DATABASE_URL=sqlite:/data/mapleos.db
    profiles: ["allinone"]

  # ============================================================
  # Option 2: Separated (server + web + qdrant)
  # For production with separate web hosting (CDN/Nginx)
  # Usage: docker compose up -d
  # ============================================================
  mapleos-server:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    ports:
      - "7788:7788"
    volumes:
      - mapleos-data:/data
    environment:
      - RUST_LOG=mapleos_server=debug,maple_engine=info
      - DATABASE_URL=sqlite:/data/mapleos.db
    depends_on:
      - qdrant
    profiles: ["separated"]

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"
    profiles: ["separated"]

volumes:
  mapleos-data:
  qdrant-data:
